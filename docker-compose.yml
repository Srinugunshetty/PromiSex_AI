version: '3.8'

services:
  promisex-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: promisex_ai_platform
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
